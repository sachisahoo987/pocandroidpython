[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-test-automation"
version = "0.1.0"
description = "Python Appium framework with configurable Android and iOS device sessions"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Appium-Python-Client==5.1.1",
    "allure-pytest==2.14.3",
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-rerunfailures==16.0",
    "pytest-xdist==3.8.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
quality = [
    "mypy==1.18.2",
    "pip-audit==2.9.0",
    "pylint==4.0.9",
    "pytest-cov==6.2.1",
    "ruff==0.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mobile_test_automation*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "B", "SIM", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["mobile_test_automation"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.mypy]
python_version = "3.14"
files = ["mobile_test_automation"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
bdd_features_base_dir = "tests/bdd/features"
addopts = [
    "-ra",
    "--strict-config",
    "-m not ignore",
    "--alluredir=allure-results",
    "--reruns=2",
]
markers = [
    "ignore: explicitly excluded Gherkin scenario",
    "general: General Store feature scenarios",
    "landing: General Store landing-page scenarios",
    "cart: General Store cart scenarios",
    "terms: General Store Terms dialog scenarios",
]
log_cli = true
log_cli_level = "INFO"

[tool.setuptools.package-data]
mobile_test_automation = ["resources/**/*.json", "config/environments/*.properties"]
