name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: python -m pip install ".[quality]"

      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit .

      - name: Check lint, naming, and redundant code patterns
        run: python -m ruff check mobile_test_automation tests

      - name: Check formatting
        run: python -m ruff format --check mobile_test_automation tests

      - name: Check application types
        run: python -m mypy

      - name: Check for duplicated application code
        run: python -m pylint --disable=all --enable=duplicate-code --min-similarity-lines=10 mobile_test_automation

      - name: Run tests and report coverage
        run: python -m pytest tests/unit --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Verify BDD scenario discovery
        run: python -m pytest --collect-only tests/bdd
